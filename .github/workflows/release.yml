name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check dist is up to date
        run: python3 scripts/build.py --check
      - name: Validate SKILL.md frontmatter
        run: python3 scripts/validate.py
      - name: Attach artefacts to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/eazypromptin.zip
            dist/eazypromptin.skill
            dist/eazypromptin-full.md
            dist/chat/instructions.md
            dist/chat/eazypromptin-knowledge.md
