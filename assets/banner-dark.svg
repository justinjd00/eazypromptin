<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="EazyPromptin: reads the intent behind your lazy prompt">
  <title>EazyPromptin</title>
  <style>@keyframes r0{0%,2.73%{opacity:0}5.23%,95%{opacity:1}100%{opacity:0}}.r0{opacity:0;animation:r0 11.0s linear infinite}@keyframes r1{0%,16.36%{opacity:0}18.86%,95%{opacity:1}100%{opacity:0}}.r1{opacity:0;animation:r1 11.0s linear infinite}@keyframes r2{0%,29.09%{opacity:0}31.59%,95%{opacity:1}100%{opacity:0}}.r2{opacity:0;animation:r2 11.0s linear infinite}@keyframes r3{0%,41.82%{opacity:0}44.32%,95%{opacity:1}100%{opacity:0}}.r3{opacity:0;animation:r3 11.0s linear infinite}@keyframes r4{0%,54.55%{opacity:0}57.05%,95%{opacity:1}100%{opacity:0}}.r4{opacity:0;animation:r4 11.0s linear infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cursor{animation:blink 1.1s steps(1) infinite}</style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="g1" cx="0.12" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#C8F542" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#C8F542" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.9" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="420" fill="#0A0B10"/>
  <rect width="1280" height="420" fill="url(#dots)"/>
  <rect width="1280" height="420" fill="url(#g1)"/>
  <rect width="1280" height="420" fill="url(#g2)"/>
  <text x="80" y="118" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="3" fill="#8A90A2">AGENT SKILL · OPEN SOURCE · ANY MODEL</text>
  <text x="76" y="212" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="-3" fill="#F4F5F7">eazy<tspan fill="#C8F542">promptin</tspan></text>
  <rect class="cursor" x="672" y="146" width="14" height="72" fill="#C8F542"/>
  <text x="80" y="272" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#C9CDD8">Reads the intent behind your lazy prompt.</text>
  <text x="80" y="310" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#C9CDD8">Then builds exactly what you meant.</text>
  <rect x="80" y="344" width="56" height="4" fill="#C8F542"/>
  <rect x="142" y="344" width="28" height="4" fill="#9B7BFF"/>
  <rect x="760" y="88" width="440" height="276" fill="#12141B" fill-opacity="0.92" stroke="#262A36"/>
  <rect x="760" y="88" width="440" height="36" fill="#262A36" fill-opacity="0.45"/>
  <text x="780" y="111" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#8A90A2">DEEP MODE · PHASE 2/5</text>
  <circle cx="1172" cy="106" r="5" fill="#C8F542"><animate attributeName="fill-opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <g class="r0"><text x="788" y="162" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8A90A2" font-weight="700">&gt;</text><text x="810" y="162" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#C9CDD8">i wanna make a game, dungeon thing, friends</text></g><g class="r1"><text x="788" y="208" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#C8F542" font-weight="700">my read</text><text x="888" y="208" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#F4F5F7">co-op roguelite, ~20 min runs</text></g><g class="r2"><text x="788" y="254" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#9B7BFF" font-weight="700">assuming</text><text x="888" y="254" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#F4F5F7">laptop GPU · 10 h/week</text></g><g class="r3"><text x="788" y="300" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#C9CDD8" font-weight="700">audit</text><text x="888" y="300" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#F4F5F7">14 guesses → 2</text></g><g class="r4"><text x="788" y="346" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#5BE49B" font-weight="700">✓</text><text x="810" y="346" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#F4F5F7">BRIEF.md  PROMPT.md  MILESTONES.md</text></g>
</svg>
